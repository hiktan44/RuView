version: "3.9"

services:
  # Rust Sensing Server — single binary serving UI + REST API (/api/v1/*) +
  # WebSocket (/ws/sensing) + /health on port 3000.
  # Service name MUST stay "python_sensing" (underscore) to match the domain key
  # Coolify has bound (docker_compose_domains.python_sensing).
  python_sensing:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    image: ruview-rust:latest
    expose:
      - "3000"   # HTTP: UI + REST API + WebSocket — Coolify proxy target
    environment:
      - RUST_LOG=info
      # simulated => deterministic synthetic CSI so the live demo works with no
      # hardware. Switch to "esp32" once a sensor mesh streams to UDP :5005.
      - CSI_SOURCE=simulated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/sensing-server", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
