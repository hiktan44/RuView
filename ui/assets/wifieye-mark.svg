<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WIFIEYE mark">
  <title>WIFIEYE — WiFi-signal eye</title>
  <!-- Almond / lens eye outline -->
  <path d="M4 32 C16 14 48 14 60 32 C48 50 16 50 4 32 Z"
        fill="none" stroke="#2DD4BF" stroke-width="3.5"
        stroke-linejoin="round"/>
  <!-- Iris = concentric WiFi arcs radiating up from the pupil -->
  <g fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round">
    <path d="M22.5 38.5 A13 13 0 0 1 41.5 38.5"/>
    <path d="M26.5 35 A8.5 8.5 0 0 1 37.5 35"/>
  </g>
  <!-- Pupil dot (WiFi emitter origin) -->
  <circle cx="32" cy="38.5" r="3.4" fill="#2DD4BF"/>
</svg>
