[package]
name = "wifi-densepose-bf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IEEE 802.11bf (WLAN Sensing) ALIGNED data model — sensing measurement abstractions (setup/measurement/report/termination, capability negotiation, trigger-based scheduling) that ingest vendor CSI today and are ready to swap in real 802.11bf measurement reports later. NOT a certified 802.11bf implementation."
repository = "https://github.com/ruvnet/RuView"

[dependencies]
serde = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
approx = "0.5"

[lib]
name = "wifi_densepose_bf"
doctest = false

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
uninlined_format_args = "allow"
assigning_clones = "allow"
