version: "3.9"

services:
  # Python Sensing Server - WebSocket + UI
  # Service name MUST stay "python_sensing" (underscore) to match the domain key
  # Coolify has bound (docker_compose_domains.python_sensing). Uses the root
  # Dockerfile (docker/Dockerfile.python does not exist).
  python_sensing:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruview-python:latest
    expose:
      - "8080"   # UI (HTTP) — Coolify binds the app domain to this port
      - "8765"   # WebSocket
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-["*"]}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
